<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Museu da Nossa Amizade</title><style>:root{font-family:Georgia,serif;color:#f7ebd3;background:#0b0d15}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#27243a,#0b0d15 70%)}main{max-width:900px;margin:auto;padding:35px 18px 80px}.top{display:flex;justify-content:space-between;align-items:center;color:#d4bb86;font:12px Arial;letter-spacing:2px}.hero{text-align:center;padding:60px 0 32px}.kicker{color:#d6b36d;font:12px Arial;letter-spacing:4px;text-transform:uppercase}h1{font-size:clamp(40px,8vw,80px);line-height:1.05;margin:20px 0;background:linear-gradient(#fff2c9,#b78c45);color:transparent;background-clip:text}h2{font-size:clamp(28px,5vw,44px);margin:0 0 12px}.subtitle{color:#bcb4aa;font:16px/1.7 Arial;max-width:620px;margin:0 auto 26px}.gold{color:#eac783}button{cursor:pointer;border:1px solid #b99454;border-radius:9px;background:linear-gradient(135deg,#c9a15a,#896127);color:#140e08;font-weight:bold;padding:14px 22px;font-size:15px}button:hover{filter:brightness(1.14)}button:disabled{opacity:.35;cursor:not-allowed}.outline{background:transparent;color:#e8c783}.panel{border:1px solid #77613e;background:linear-gradient(145deg,#242334,#11131d);border-radius:18px;padding:clamp(22px,5vw,42px);box-shadow:0 20px 80px #0007}.art{font-size:64px;text-align:center;padding:12px}.center{text-align:center}.muted{color:#b9b4b4;font:15px/1.7 Arial}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:25px 0}.tile{padding:25px;border:1px solid #6b5639;border-radius:14px;background:#191b27;min-height:180px;display:flex;flex-direction:column;justify-content:space-between}.tile .emoji{font-size:38px}.tile h3{margin:12px 0 5px}.tile p{font:13px/1.5 Arial;color:#b8b2ad}.locked{opacity:.42}.bar{height:6px;border-radius:9px;background:#35313a;margin:16px 0 28px;overflow:hidden}.fill{height:100%;background:#d3a759;transition:width .4s}.hide{display:none!important}.choices{display:grid;gap:12px;margin:22px 0}.choice{background:#242537;color:#f6e7cc;text-align:left;border-color:#675639}.choice:hover{background:#373044}textarea,input{width:100%;padding:15px;background:#131520;color:white;border:1px solid #8c7145;border-radius:9px;font:16px Arial;margin:10px 0 18px}textarea{min-height:110px;resize:vertical}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.reveal{animation:fade .5s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.award{padding:20px;border:1px solid #7e6030;background:#211c20;border-radius:12px;margin:12px 0}.stamp{font-size:45px}.letter{font:18px/1.9 Georgia;white-space:pre-line;color:#e8ddc9}.foot{text-align:center;font:12px Arial;color:#888;margin-top:35px} .confetti{font-size:45px;letter-spacing:8px}</style></head><body><main><div class="top"><span>✦ ACERVO PARTICULAR</span><span id="progressLabel">CONVITE EXCLUSIVO</span></div><div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div><section id="intro" class="hero reveal"><div class="kicker">Uma experiência feita especialmente para você</div><h1>Museu da<br>Nossa Amizade</h1><p class="subtitle">Algumas pessoas merecem mais do que um simples “feliz aniversário”. Merecem um museu inteiro. Hoje, a exposição principal é você.</p><div class="panel" style="max-width:530px;margin:30px auto"><div class="art">🏛️</div><label class="muted" for="name">Como o aniversariante deve ser chamado?</label><input id="name" placeholder="Nome ou apelido" maxlength="40"><button onclick="start()">Abrir as portas do museu →</button></div></section><section id="room" class="hide reveal"><div class="kicker" id="roomTag"></div><div class="panel" id="roomContent"></div><div class="nav"><button class="outline" id="back" onclick="prev()">← Voltar</button><button id="next" onclick="next()">Próxima sala →</button></div></section><div class="foot">Feito com carinho, humor e um pouco de exagero. ✦</div></main><script>let name='Lenda',step=0,quiz=0,awards=[false,false,false],coffer=false,letter=false;const $=id=>document.getElementById(id);function start(){name=$('name').value.trim()||'Lenda';$('intro').classList.add('hide');$('room').classList.remove('hide');render()}function next(){if(step<5){step++;render()}else{step=0;render()}}function prev(){if(step>0){step--;render()}else{$('room').classList.add('hide');$('intro').classList.remove('hide')}}function render(){const titles=['Hall das Lendas','Teste da Amizade','Cofre das Surpresas','O Que Eu Nunca Te Disse','Cápsula do Tempo','Grande Final'];$('roomTag').textContent=`SALA ${step+1} DE 6 · ${titles[step].toUpperCase()}`;$('progressLabel').textContent=`${Math.round((step+1)/6*100)}% DA VISITA`;$('progressFill').style.width=`${(step+1)/6*100}%`;$('back').style.display=step===5?'none':'inline-block';$('next').textContent=step===5?'Visitar novamente ↻':'Próxima sala →';$('next').disabled=step===1&&quiz<3||step===2&&!coffer;let h='';if(step===0){h=`<div class="center"><div class="art">🏆</div><h2>Hall das Lendas</h2><p class="muted">Bem-vindo, ${esc(name)}. Uma comissão completamente imparcial decidiu que você merece estas honrarias. Clique nos troféus.</p></div><div class="grid">${['🏅|Sobrevivente de Todas as Fases|Por continuar em pé mesmo nos dias mais absurdos.','👑|Patrimônio da Resenha|Por transformar qualquer conversa comum em uma história.','💛|Amizade de Ouro|Porque sua presença torna a vida mais leve.'].map((a,i)=>{let p=a.split('|');return `<div class="tile" onclick="award(${i})" style="cursor:pointer"><div class="emoji">${p[0]}</div><h3>${p[1]}</h3><p>${awards[i]?p[2]:'Toque para revelar a homenagem'}</p></div>`}).join('')}</div>`}if(step===1){let qs=[['Qual é a regra mais importante de uma amizade verdadeira?',['Nunca discordar','Estar presente até nas fases difíceis','Responder em 3 segundos'],1],['Qual é o prêmio por aguentar minhas piadas?',['Uma medalha imaginária','Uma ilha particular','Um carro esportivo'],0],['Qual é o verdadeiro tesouro deste museu?',['Os objetos de ouro','As memórias e a amizade','O ar-condicionado'],1]];let q=qs[Math.min(quiz,2)];h=`<div class="center"><div class="art">🧩</div><h2>Teste da Amizade</h2><p class="muted">${quiz<3?`Pergunta ${quiz+1} de 3`:'Desafio concluído!'}</p></div>${quiz<3?`<h3>${q[0]}</h3><div class="choices">${q[1].map((v,i)=>`<button class="choice" onclick="answer(${i},${q[2]})">${v}</button>`).join('')}</div><p id="feedback" class="muted"></p>`:'<div class="award center"><div class="stamp">🎖️</div><h3>Certificado de Amigo Lendário</h3><p>Concedido por serviços prestados à amizade e à resenha.</p></div>'}`}if(step===2){h=`<div class="center"><div class="art">${coffer?'🎁':'🔐'}</div><h2>O Cofre das Surpresas</h2><p class="muted">${coffer?'Você encontrou a mensagem secreta!':'Para abrir o cofre, descubra a palavra que fica maior quando é compartilhada.'}</p></div>${coffer?'<div class="award center"><h3>Surpresa desbloqueada ✨</h3><p>O melhor presente nem sempre cabe numa caixa. Às vezes, é saber que existem pessoas torcendo por você.</p></div>':'<input id="code" placeholder="Digite a palavra secreta"><button onclick="unlock()">Desbloquear cofre</button><p id="hint" class="muted">Dica: começa com A e termina com E.</p>'}`}if(step===3){h=`<div class="center"><div class="art">✉️</div><h2>O Que Eu Nunca Te Disse</h2><p class="muted">Aqui a brincadeira dá espaço ao que realmente importa.</p></div><div class="award"><p class="letter">${letter?`Feliz aniversário, ${esc(name)}!\n\nNem sempre a gente para para dizer o quanto uma amizade faz diferença. Entre as conversas, as risadas e os dias comuns, algumas pessoas acabam se tornando parte importante da nossa história.\n\nEspero que este novo ciclo te traga coragem para buscar o que deseja, saúde para aproveitar cada conquista e pessoas boas para dividir o caminho.\n\nObrigado pela amizade. Que venham muitas histórias para contar. 💛`:'Há uma carta esperando por você...'}</p></div><div class="center"><button onclick="letter=true;render()">${letter?'Ler novamente':'Abrir a carta ✉️'}</button></div>`}if(step===4){h=`<div class="center"><div class="art">⏳</div><h2>Cápsula do Tempo</h2><p class="muted">Deixe uma mensagem para você mesmo ler no próximo aniversário. Você pode salvá-la no seu dispositivo.</p></div><label class="muted">Uma coisa que quero conquistar até meu próximo aniversário:</label><textarea id="dream" placeholder="Escreva aqui..."></textarea><label class="muted">Uma coisa que não quero esquecer:</label><textarea id="remember" placeholder="Escreva aqui..."></textarea><button onclick="saveCapsule()">Salvar minha cápsula ↓</button><p class="muted">O arquivo fica com você. Este site não envia nem armazena suas respostas em servidores.</p>`}if(step===5){h=`<div class="center"><div class="confetti">🎉✨🎂</div><h2>Feliz aniversário, ${esc(name)}!</h2><p class="subtitle">Você chegou ao fim do museu, mas a nossa história continua. Que o próximo capítulo venha com mais alegrias, conquistas e histórias absurdas para lembrar.</p><div class="award"><h3>🏛️ Visitante de Honra</h3><p>Este museu sempre terá um lugar reservado para você.</p></div><button onclick="share()">Copiar mensagem de aniversário</button></div>`}$('roomContent').innerHTML=h;window.scrollTo({top:0,behavior:'smooth'})}function award(i){awards[i]=true;render()}function answer(i,right){if(i===right){quiz++;render()}else{$('feedback').textContent='Boa tentativa! O museu recomenda tentar outra resposta 😄'}}function unlock(){let v=$('code').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(v==='amizade'){coffer=true;render()}else $('hint').textContent='Ainda não! Dica: a palavra é AMIZADE.'}function saveCapsule(){let a=$('dream').value,b=$('remember').value;if(!a.trim()&&!b.trim()){alert('Escreva pelo menos uma mensagem.');return}let txt=`CÁPSULA DO TEMPO DE ${name}\nCriada em ${new Date().toLocaleDateString('pt-BR')}\n\nQuero conquistar:\n${a}\n\nNão quero esquecer:\n${b}\n\nAbra no próximo aniversário!`;let blob=new Blob([txt],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='minha-capsula-do-tempo.txt';el.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function share(){let t=`Feliz aniversário, ${name}! 🎉 Que seu novo ciclo seja incrível!`;navigator.clipboard?.writeText(t).then(()=>alert('Mensagem copiada!')).catch(()=>prompt('Copie a mensagem:',t))}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
